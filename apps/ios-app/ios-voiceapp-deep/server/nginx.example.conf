# Example: reverse-proxy everything on ongovoiceapp.taskor.io to token-server.mjs (port 3001).
# If only /token was proxied before, /webhook/voice would 404 from nginx — use a catch-all or add locations.
#
# Install: copy into /etc/nginx/sites-available/ (adjust paths), then:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name ongovoiceapp.taskor.io;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
